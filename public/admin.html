    function enrichDemoSales(summary) {
      var grandSales = {
        ordered: { cakes: 0, amount: 0, orders: 0 },
        cancelled: { orders: 0 },
        paid: { cakes: 0, amount: 0 },
        pickedUp: { cakes: 0 },

        walkIn: { cakes: 0, amount: 0, cash: 0, upi: 0 },

        collected: { amount: 0 }

          var row = date.items[name] || (date.items[name] = { total: 0 });

          row.pickedUp = Math.floor(row.total * (index === 4 ? 0 : 0.45));

        var picked = MENU_ITEMS.reduce(function (n, name) { return n + (date.items[name].pickedUp || 0); }, 0);

          pendingPickup: { cakes: Math.max(0, date.totals.cakes - picked) },

        grandSales.ordered.amount += date.sales.ordered.amount;

        grandSales.paid.cakes += date.sales.paid.cakes;
        grandSales.paid.amount += date.sales.paid.amount;
        grandSales.pickedUp.cakes += date.sales.pickedUp.cakes;
        grandSales.walkIn.cakes += date.sales.walkIn.cakes;
        grandSales.walkIn.amount += date.sales.walkIn.amount;
        grandSales.walkIn.cash += date.sales.walkIn.cash;
        grandSales.walkIn.upi += date.sales.walkIn.upi;
        MENU_ITEMS.forEach(function (name) {
          var grow = summary.grand.items[name];
          var drow = date.items[name];
          grow.ordered = (grow.ordered || 0) + drow.ordered;
          grow.pickedUp = (grow.pickedUp || 0) + drow.pickedUp;
          grow.walkIn = (grow.walkIn || 0) + drow.walkIn;
        });
      });
      grandSales.pendingPickup.cakes = Math.max(0, grandSales.ordered.cakes - grandSales.pickedUp.cakes);
      grandSales.totalSold.cakes = grandSales.pickedUp.cakes + grandSales.walkIn.cakes;
      grandSales.collected.amount = grandSales.paid.amount + grandSales.walkIn.amount;
      summary.grand.sales = grandSales;
    }
    enrichDemoSales(MOCK_SUMMARY);

    const els = {
      banner: document.getElementById('example-banner'),
      updated: document.getElementById('updated'),
      status: document.getElementById('status'),
      cakes: document.getElementById('card-cakes'),
      amount: document.getElementById('card-amount'),
      orders: document.getElementById('card-orders'),
      ordered: document.getElementById('card-ordered'),
      pickedup: document.getElementById('card-pickedup'),
      walkin: document.getElementById('card-walkin'),
      sold: document.getElementById('card-sold'),
      collected: document.getElementById('card-collected'),
      chips: document.getElementById('date-chips'),
      panels: document.getElementById('date-panels'),
      matrixWrap: document.getElementById('matrix-wrap'),
      toast: document.getElementById('toast'),
      refresh: document.getElementById('refresh-btn'),
      copySelected: document.getElementById('copy-selected'),
      expandAll: document.getElementById('expand-all'),
      collapseAll: document.getElementById('collapse-all')
    };

    var summaryState = null;
    var selectedId = 'all';
    var usingMock = false;
    var refreshTimer = null;

    function nowRef() {
      if (window.__TEST_NOW && typeof window.__TEST_NOW.getTime === 'function') return window.__TEST_NOW;
      return new Date();
    }

    function isPreviewMode() {
      return /(?:\?|&)preview=1(?:&|$)/.test(location.search || '');
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatINR(amount) {
      return '₹' + Number(amount || 0).toLocaleString('en-IN');
    }

    function isPastDate(date, now) {
      now = now || nowRef();
      if (!date) return false;
      var close = date.closesAt ? new Date(date.closesAt) : new Date(date.id + 'T08:30:00+05:30');
      return !isNaN(close.getTime()) && now.getTime() >= close.getTime();
    }

    function nextUpcomingId(dates, now) {
      dates = dates || [];
      now = now || nowRef();
      var i;
      for (i = 0; i < dates.length; i++) {
        if (!isPastDate(dates[i], now)) return dates[i].id;
      }
      return dates.length ? dates[dates.length - 1].id : 'all';
    }

    function readPanelState() {
      try {
        var raw = localStorage.getItem(PANEL_STATE_KEY);
        var parsed = raw ? JSON.parse(raw) : {};
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (err) {
        return {};
      }
    }

    function writePanelState(state) {
      try { localStorage.setItem(PANEL_STATE_KEY, JSON.stringify(state || {})); } catch (err) {}
    }

    function panelShouldOpen(id, defaults) {
      var saved = readPanelState();
      if (Object.prototype.hasOwnProperty.call(saved, id)) return !!saved[id];
      return !!defaults[id];
    }

    function persistOpenFromDom() {
      var state = readPanelState();
      document.querySelectorAll('details[data-panel-id]').forEach(function (el) {
        state[el.getAttribute('data-panel-id')] = el.open;
      });
      writePanelState(state);
    }

    function setStatus(message, isError) {
      els.status.textContent = message || '';
      els.status.classList.toggle('is-error', !!isError);
    }

    function emptySales() {
      return {
        ordered: { cakes: 0, amount: 0, orders: 0 },
        cancelled: { orders: 0 },
        paid: { cakes: 0, amount: 0 },
        pickedUp: { cakes: 0 },
        pendingPickup: { cakes: 0 },
        walkIn: { cakes: 0, amount: 0, cash: 0, upi: 0 },
        totalSold: { cakes: 0 },
        collected: { amount: 0 }
      };
    }

    function salesOf(obj) {
      if (obj && obj.sales) return obj.sales;
      if (obj && obj.totals) {
        return {
          ordered: { cakes: obj.totals.cakes || 0, amount: obj.totals.amount || 0, orders: obj.totals.orders || 0 },
          cancelled: { orders: 0 },
          paid: { cakes: 0, amount: 0 },
          pickedUp: { cakes: 0 },
          pendingPickup: { cakes: obj.totals.cakes || 0 },
          walkIn: { cakes: 0, amount: 0, cash: 0, upi: 0 },
          totalSold: { cakes: 0 },
          collected: { amount: 0 }
        };
      }
      return emptySales();
    }

    function selectedScope(data) {
      if (!data) return { cakes: 0, amount: 0, orders: 0, items: {}, sales: emptySales(), label: 'All dates', dates: [] };
      if (selectedId !== 'all') {
        var date = (data.dates || []).find(function (d) { return d.id === selectedId; });
        if (date) {
          return {
            cakes: date.totals.cakes,
            amount: date.totals.amount,
            orders: date.totals.orders,
            items: date.items,
            sales: salesOf(date),
            label: date.label,
            dates: [date]
          };
        }
      }
      return {
        cakes: data.grand.cakes,
        amount: data.grand.amount,
        orders: data.grand.orders,
        items: data.grand.items,
        sales: salesOf(data.grand),
        label: 'All dates',
        dates: data.dates
      };
    }

    function renderCards(scope) {
      els.cakes.textContent = String(scope.cakes);
      els.amount.textContent = formatINR(scope.amount);
      els.orders.textContent = String(scope.orders);
      var sales = scope.sales || emptySales();
      if (els.ordered) els.ordered.textContent = String(sales.ordered.cakes);
      if (els.pickedup) els.pickedup.textContent = String(sales.pickedUp.cakes);
      if (els.walkin) els.walkin.textContent = String(sales.walkIn.cakes);
      if (els.sold) els.sold.textContent = String(sales.totalSold.cakes);
      if (els.collected) els.collected.textContent = formatINR(sales.collected.amount);
    }

    function renderChips(data) {
      var dates = (data && data.dates) || [];
      var html = '<button type="button" class="date-chip ' + C_CHIP + '" data-id="all" aria-pressed="' + (selectedId === 'all' ? 'true' : 'false') + '">All dates</button>';
      dates.forEach(function (date) {
        html += '<button type="button" class="date-chip ' + C_CHIP + '" data-id="' + escapeHtml(date.id) + '" aria-pressed="' +
          (selectedId === date.id ? 'true' : 'false') + '">' + escapeHtml(date.label) + '</button>';
      });
      els.chips.innerHTML = html;
    }

    function itemSplit(items, name) {
      var row = (items && items[name]) || {};
      return { total: Number(row.total || 0) };
    }

    function cakesTable(items, caption, tableId) {
      var foot = { total: 0 };
      var rows = MENU_ITEMS.map(function (name) {
        var q = itemSplit(items, name);
        foot.total += q.total;
        return '<tr><th scope="row">' + escapeHtml(name) + '</th><td>' + q.total + '</td></tr>';
      }).join('');
      return '<table class="' + C_TABLE + '" id="' + escapeHtml(tableId) + '">' +
        '<caption>' + escapeHtml(caption) + '</caption>' +
        '<thead><tr><th scope="col">Item</th><th scope="col">Total</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '<tfoot><tr><th scope="row">Total</th><td>' + foot.total + '</td></tr></tfoot>' +
        '</table>';
    }

    function pickupProgress(date) {
      var sales = salesOf(date);
      var ordered = sales.ordered.cakes;
      var picked = sales.pickedUp.cakes;
      var pct = ordered > 0 ? Math.min(100, Math.round((picked / ordered) * 100)) : 0;
      var label = ordered > 0 ? (picked + ' of ' + ordered + ' picked up') : 'No orders yet';
      return '<div class="progress relative mt-4 mb-4 min-h-6 overflow-hidden rounded-full bg-m3-surface-container-high" role="progressbar" aria-valuemin="0" aria-valuemax="' + ordered +
        '" aria-valuenow="' + picked + '" aria-label="' + escapeHtml(label) + '">' +
        '<span class="progress-fill block h-6 w-0 max-w-full rounded-full bg-pine" style="width:' + pct + '%"></span>' +
        '<span class="progress-label absolute inset-0 flex items-center justify-center text-[0.75rem] font-medium tracking-[0.5px] text-m3-on-surface">' + escapeHtml(label) + '</span></div>';
    }

    function soldTable(date, tableId) {
      var foot = { ordered: 0, pickedUp: 0, walkIn: 0, sold: 0 };
      var rows = MENU_ITEMS.map(function (name) {
        var row = (date.items && date.items[name]) || {};
        var ordered = Number(row.ordered != null ? row.ordered : row.total || 0);
        var picked = Number(row.pickedUp || 0);
        var walk = Number(row.walkIn || 0);
        var sold = picked + walk;
        foot.ordered += ordered;
        foot.pickedUp += picked;
        foot.walkIn += walk;
        foot.sold += sold;
        return '<tr><th scope="row">' + escapeHtml(name) + '</th><td>' + ordered + '</td><td>' + picked +
          '</td><td>' + walk + '</td><td>' + sold + '</td></tr>';
      }).join('');
      return '<table class="sold-table mt-4 ' + C_TABLE + '" id="' + escapeHtml(tableId) + '">' +
        '<caption>Ordered vs sold — ' + escapeHtml(date.label) + '</caption>' +
        '<thead><tr><th scope="col">Item</th><th scope="col">Ordered</th><th scope="col">Picked up</th>' +
        '<th scope="col">Walk-in</th><th scope="col">Total sold</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '<tfoot><tr><th scope="row">Total</th><td>' + foot.ordered + '</td><td>' + foot.pickedUp +
        '</td><td>' + foot.walkIn + '</td><td>' + foot.sold + '</td></tr></tfoot></table>';
    }

    function datePanelHtml(date, open) {
      var meta = date.totals.cakes + (date.totals.cakes === 1 ? ' cake' : ' cakes') + ' · ' + formatINR(date.totals.amount) + ' · ' +
        date.totals.orders + (date.totals.orders === 1 ? ' order' : ' orders');
      return '<details class="date-panel bg-m3-surface ' + C_DETAILS + '" data-panel-id="' + escapeHtml(date.id) + '"' + (open ? ' open' : '') + '>' +
        '<summary class="' + C_SUMMARY + '">' +
          '<span class="chevron ' + C_CHEVRON + '" aria-hidden="true"></span>' +
          '<span class="summary-text ' + C_SUMMARY_TEXT + '">' +
            '<span class="summary-title ' + C_SUMMARY_TITLE + '">' + escapeHtml(date.label) + '</span>' +
            '<span class="summary-meta ' + C_SUMMARY_META + '">' + escapeHtml(meta) + '</span>' +
          '</span>' +
        '</summary>' +
        '<div class="panel-body ' + C_PANEL_BODY + '"><div class="panel-inner ' + C_PANEL_INNER + '">' +
          cakesTable(date.items, 'Cakes to order — ' + date.label, 'table-' + date.id) +
          pickupProgress(date) +
          soldTable(date, 'sold-' + date.id) +
          '<div class="table-actions mt-4">' +
            '<button type="button" class="btn btn-primary copy-btn ' + C_BTN_PRIMARY + '" data-copy-id="' + escapeHtml(date.id) + '">Copy for Poppins</button>' +
          '</div>' +
        '</div></div>' +
      '</details>';
    }

    function renderPanels(data) {
      var dates = (data && data.dates) || [];
      var upcomingId = nextUpcomingId(dates);
      var visible = selectedId === 'all' ? dates : dates.filter(function (d) { return d.id === selectedId; });
      var upcoming = visible.filter(function (d) { return !isPastDate(d); });
      var past = visible.filter(function (d) { return isPastDate(d); });
      var defaults = {};
      defaults[upcomingId] = true;
      defaults.past = false;
      defaults.matrix = true;

      var html = '';
      upcoming.forEach(function (date) {
        html += datePanelHtml(date, panelShouldOpen(date.id, defaults));
      });
      if (selectedId === 'all' && past.length) {
        var pastOpen = panelShouldOpen('past', defaults);
        html += '<details class="past-group bg-m3-surface-container ' + C_DETAILS + '" data-panel-id="past"' + (pastOpen ? ' open' : '') + '>' +
          '<summary class="' + C_SUMMARY + '"><span class="chevron ' + C_CHEVRON + '" aria-hidden="true"></span>' + '<span class="summary-text ' + C_SUMMARY_TEXT + '">' +
          '<span class="summary-title ' + C_SUMMARY_TITLE + '">Past dates</span>' +
          '<span class="summary-meta ' + C_SUMMARY_META + '">' + past.length + (past.length === 1 ? ' date' : ' dates') + '</span>' +
          '</span></summary><div class="panel-body ' + C_PANEL_BODY + '"><div class="panel-inner ' + C_PANEL_INNER + '" id="past-inner"></div></div></details>';
      } else if (selectedId !== 'all') {
        past.forEach(function (date) {
          html += datePanelHtml(date, true);
        });
      }
      els.panels.innerHTML = html;
      if (selectedId === 'all' && past.length) {
        var inner = document.getElementById('past-inner');
        if (inner) {
          inner.innerHTML = past.map(function (date) {
            return datePanelHtml(date, panelShouldOpen(date.id, defaults));
          }).join('');
        }
      }
    }

    function renderMatrix(data) {
      if (!els.matrixWrap) return;
      var dates = (data && data.dates) || [];
      if (selectedId !== 'all' || !dates.length) { els.matrixWrap.innerHTML = ''; return; }
      var open = panelShouldOpen('matrix', { matrix: true });
      var head = '<th scope="col">Item</th>' + dates.map(function (d) {
        return '<th scope="col">' + escapeHtml(d.label) + '</th>';
      }).join('') + '<th scope="col">Total</th>';
      var body = MENU_ITEMS.map(function (name) {
        var total = 0;
        var cells = dates.map(function (d) {
          var q = itemSplit(d.items, name).total;
          total += q;
          return '<td>' + q + '</td>';
        }).join('');
        return '<tr><th scope="row">' + escapeHtml(name) + '</th>' + cells + '<td>' + total + '</td></tr>';
      }).join('');
      var footCells = '';
      var footTotal = 0;
      dates.forEach(function (d) {
        footCells += '<td>' + d.totals.cakes + '</td>';
        footTotal += d.totals.cakes;
      });
      els.matrixWrap.innerHTML = '<details class="matrix-panel hidden bg-m3-surface lg:block min-[1100px]:sticky min-[1100px]:top-4 min-[1100px]:mb-0 ' + C_DETAILS + '" data-panel-id="matrix"' + (open ? ' open' : '') + '>' +
        '<summary class="' + C_SUMMARY + '"><span class="chevron ' + C_CHEVRON + '" aria-hidden="true"></span>' + '<span class="summary-text ' + C_SUMMARY_TEXT + '">' +
        '<span class="summary-title ' + C_SUMMARY_TITLE + '">All dates at a glance</span>' +
        '<span class="summary-meta ' + C_SUMMARY_META + '">Cakes by item and pickup date</span></span></summary>' +
        '<div class="panel-body ' + C_PANEL_BODY + '"><div class="panel-inner matrix-wrap overflow-x-auto overflow-y-hidden px-4 pb-4">' +
        '<table class="' + C_TABLE + '" id="matrix-table"><caption>Cakes to order across all pickup dates</caption>' +
        '<thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody>' +
        '<tfoot><tr><th scope="row">Total</th>' + footCells + '<td>' + footTotal + '</td></tr></tfoot>' +
        '</table></div></div></details>';
    }

    function renderAll(data) {
      var scope = selectedScope(data);
      renderCards(scope);
      renderChips(data);
      renderPanels(data);
      renderMatrix(data);
      var latest = data && data.latestOrderAt ? ' Latest order ' + data.latestOrderAt + '.' : '';
      els.updated.textContent = data && data.lastUpdated
        ? ('Last updated ' + data.lastUpdated + '.' + latest)
        : 'Last updated —';
    }

    function poppinsTextForDate(date) {
      var lines = [
        'Vailankanni Matha Youth — cakes to order from Poppins Bakers',
        'Pickup: ' + date.label,
        ''
      ];
      MENU_ITEMS.forEach(function (name) {
        var q = itemSplit(date.items, name);
        lines.push(name + ': ' + q.total);
      });
      lines.push('');
      lines.push('Total cakes: ' + date.totals.cakes);
      lines.push('Total amount: ' + formatINR(date.totals.amount));
      lines.push('Orders: ' + date.totals.orders);
      return lines.join('\n');
    }

    function poppinsTextForAll(data) {
      var blocks = ['Vailankanni Matha Youth — cakes to order from Poppins Bakers', ''];
      (data.dates || []).forEach(function (date) {
        blocks.push(poppinsTextForDate(date), '');
      });
      blocks.push('GRAND TOTAL: ' + data.grand.cakes + ' cakes, ' + formatINR(data.grand.amount) + ', ' + data.grand.orders + ' orders');
      return blocks.join('\n');
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('visible');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(function () { els.toast.classList.remove('visible'); }, 2800);
    }

    async function copyForPoppins(dateId) {
      if (!summaryState) return;
      var text;
      if (!dateId || dateId === 'all') {
        if (selectedId !== 'all') {
          var one = summaryState.dates.find(function (d) { return d.id === selectedId; });
          text = one ? poppinsTextForDate(one) : poppinsTextForAll(summaryState);
        } else {
          text = poppinsTextForAll(summaryState);
        }
      } else {
        var date = summaryState.dates.find(function (d) { return d.id === dateId; });
        if (!date) return;
        text = poppinsTextForDate(date);
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          throw new Error('no clipboard');
        }
        showToast('Copied the Poppins summary.');
      } catch (err) {
        showToast('Could not copy automatically — the text is in the console.');
        try { console.log(text); } catch (err2) {}
      }
    }

    function setSelected(id) {
      selectedId = id || 'all';
      if (summaryState) renderAll(summaryState);
    }

    function setAllPanels(open) {
      document.querySelectorAll('details[data-panel-id]').forEach(function (el) { el.open = open; });
      persistOpenFromDom();
    }

    function getSheetsUrl() {
      return (window.__SHEETS_URL || SHEETS_WEBAPP_URL || '').trim();
    }

    async function fetchSummary() {
      if (isPreviewMode() || window.__USE_MOCK_SUMMARY) {
        usingMock = true;
        return JSON.parse(JSON.stringify(window.__MOCK_SUMMARY || MOCK_SUMMARY));
      }
      const base = getSheetsUrl();
      const url = base + (base.indexOf('?') >= 0 ? '&' : '?') + 'action=summary';
      const res = await fetch(url, { method: 'GET', redirect: 'follow' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || data.ok === false) throw new Error((data && data.error) || 'No totals returned');
      return data;
    }

    async function loadSummary(opts) {
      opts = opts || {};
      if (!opts.silent) setStatus('Loading totals…', false);
      try {
        const data = await fetchSummary();
        summaryState = data;
        if (!opts.keepSelection) {
          if (selectedId !== 'all' && !(data.dates || []).some(function (d) { return d.id === selectedId; })) {
            selectedId = nextUpcomingId(data.dates);
          }
          if (!opts.keepSelection && !opts.hasPicked && selectedId === 'all' && !window.__KEEP_SELECTION) {
            /* first load defaults to the next upcoming date */
          }
        }
        if (opts.initial) {
          if (/(?:\?|&)view=all(?:&|$)/.test(location.search || '') || window.__START_ALL) {
            selectedId = 'all';
          } else {
            selectedId = nextUpcomingId(data.dates);
          }
        }
        renderAll(data);
        els.banner.classList.toggle('visible', usingMock || isPreviewMode());
        setStatus(usingMock || isPreviewMode() ? 'Showing example data.' : '', false);
      } catch (err) {
        setStatus("Couldn't load totals. Check the Sheets connection and try Refresh.", true);
        if (!summaryState) {
          els.updated.textContent = 'Last updated —';
        }
      }
    }

    els.chips.addEventListener('click', function (event) {
      var btn = event.target.closest('.date-chip');
      if (!btn) return;
      setSelected(btn.getAttribute('data-id'));
    });
    els.panels.addEventListener('click', function (event) {
      var copy = event.target.closest('[data-copy-id]');
      if (copy) copyForPoppins(copy.getAttribute('data-copy-id'));
    });
    els.panels.addEventListener('toggle', function (event) {
      if (event.target && event.target.matches && event.target.matches('details[data-panel-id]')) persistOpenFromDom();
    }, true);
    els.matrixWrap.addEventListener('toggle', function (event) {
      if (event.target && event.target.matches && event.target.matches('details[data-panel-id]')) persistOpenFromDom();
    }, true);
    els.expandAll.addEventListener('click', function () { setAllPanels(true); });
    els.collapseAll.addEventListener('click', function () { setAllPanels(false); });
    els.refresh.addEventListener('click', function () { loadSummary({ keepSelection: true, silent: false }); });
    if (els.copySelected) {
      els.copySelected.addEventListener('click', function () { copyForPoppins(selectedId); });
    }

    window.addEventListener('beforeprint', function () {
      document.querySelectorAll('details').forEach(function (el) {
        el.setAttribute('data-print-open', el.open ? '1' : '0');
        el.open = true;
      });
    });
    window.addEventListener('afterprint', function () {
      document.querySelectorAll('details').forEach(function (el) {
        el.open = el.getAttribute('data-print-open') === '1';
        el.removeAttribute('data-print-open');
      });
    });

    loadSummary({ initial: true });
    refreshTimer = setInterval(function () { loadSummary({ keepSelection: true, silent: true }); }, REFRESH_MS);

    window.__admin = {
      MOCK_SUMMARY: MOCK_SUMMARY,
      loadSummary: loadSummary,
      setSelected: setSelected,
      copyForPoppins: copyForPoppins,
      poppinsTextForDate: poppinsTextForDate,
      nextUpcomingId: nextUpcomingId,
      isPastDate: isPastDate,
      formatINR: formatINR,
      getState: function () { return { selectedId: selectedId, summary: summaryState, usingMock: usingMock }; },
      stop: function () {
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
      }
    };
  </script>
</body>
</html>
