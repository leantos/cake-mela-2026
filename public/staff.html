<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#7a0a10">
  <meta name="description" content="Staff desk for the Vailankanni Parish Youth Christmas cake sale.">
  <title>Staff desk — Vailankanni Parish Youth</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    :root {
      --maroon: #7a0a10;
      --maroon-dark: #520505;
      --maroon-soft: #ead6d0;
      --gold: #c27b13;
      --gold-dark: #904108;
      --cream: #f7ede5;
      --cream-light: #fbf9f7;
      --cream-deep: #eadace;
      --ink: #2a2306;
      --muted: #5d563e;
      --pine: #435718;
      --blue: #0544b3;
      --blue-dark: #0c3c98;
      --line: #eadace;
      --card: var(--cream-light);
      --bg: var(--cream);
      --shadow: 0 8px 24px rgba(42, 35, 6, 0.1);
      --radius: 16px;
      --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      --serif: Georgia, "Palatino Linotype", Palatino, "Times New Roman", serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--cream-deep);
      color: var(--ink);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      box-shadow: 0 0 40px rgba(42, 35, 6, 0.12);
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }

    header.hero-head {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      background: var(--card);
      color: var(--blue);
      padding: 0.7rem 0.9rem;
      padding-top: calc(0.7rem + env(safe-area-inset-top));
      border-bottom: 3px solid var(--maroon);
    }
    header.hero-head .logo {
      display: block;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }
    header.hero-head .brand { min-width: 0; flex: 1; text-align: left; }
    header.hero-head h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.2;
      color: var(--blue);
    }
    header.hero-head .tagline {
      margin: 0.15rem 0 0;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }
    .lock-btn {
      flex-shrink: 0;
      min-height: 44px;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      border: 1.5px solid var(--maroon);
      background: transparent;
      color: var(--maroon);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .example-banner {
      display: none;
      margin: 0;
      padding: 0.45rem 0.9rem;
      background: #fff4d6;
      color: var(--gold-dark);
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      border-bottom: 1px solid #efd59a;
    }
    body.is-preview .example-banner { display: block; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      padding: 0.7rem 0.9rem 0;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .tab-btn {
      min-height: 48px;
      border: none;
      border-radius: 999px;
      background: var(--cream-light);
      color: var(--muted);
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: inset 0 0 0 1.5px var(--cream-deep);
    }
    .tab-btn[aria-selected="true"] {
      background: var(--maroon);
      color: #fff;
      box-shadow: none;
    }

    .page { padding: 0.8rem 0.9rem 1.6rem; flex: 1; }
    .panel[hidden] { display: none !important; }

    .chips {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.4rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0.15rem 0 0.2rem;
      margin: 0 0 0.6rem;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      border: 1.5px solid var(--cream-deep);
      background: var(--cream-light);
      color: var(--ink);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .chip[aria-pressed="true"] {
      background: var(--maroon);
      border-color: var(--maroon);
      color: #fff;
    }

    .search {
      width: 100%;
      min-height: 48px;
      border: 1.5px solid var(--cream-deep);
      border-radius: 12px;
      padding: 0.55rem 0.85rem;
      background: var(--cream-light);
      color: var(--ink);
      margin-bottom: 0.7rem;
    }
    .search:focus {
      outline: 2px solid var(--gold);
      outline-offset: 1px;
      border-color: var(--gold);
    }

    .counts {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 0.45rem;
      margin: 0 0 0.8rem;
    }
    .count-card {
      background: var(--cream-light);
      border-radius: 14px;
      padding: 0.55rem 0.55rem 0.6rem;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .count-card .label {
      margin: 0;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .count-card .value {
      margin: 0.15rem 0 0;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--maroon);
      line-height: 1.1;
    }
    .count-card .sub {
      margin: 0.15rem 0 0;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--gold-dark);
    }

    .updated {
      margin: 0 0 0.7rem;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    .order-list, .walkin-list { display: flex; flex-direction: column; gap: 0.7rem; }
    .empty {
      margin: 0.6rem 0;
      padding: 1.1rem 0.8rem;
      text-align: center;
      color: var(--muted);
      background: var(--cream-light);
      border-radius: var(--radius);
    }

    .order-card, .walkin-card {
      background: var(--cream-light);
      border-radius: var(--radius);
      padding: 0.85rem 0.9rem 0.9rem;
      box-shadow: var(--shadow);
    }
    .order-top, .walkin-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.6rem;
    }
    .order-name, .walkin-item {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--ink);
    }
    .order-meta, .walkin-meta {
      margin: 0.2rem 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .phone-link {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }
    .order-items {
      margin: 0.45rem 0 0;
      font-size: 0.9rem;
      white-space: pre-line;
      color: var(--ink);
    }
    .order-total {
      margin: 0.35rem 0 0;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--maroon);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .pill-pending { background: #f8e3bf; color: var(--gold-dark); }
    .pill-paid { background: #dce8c8; color: var(--pine); }
    .pill-picked { background: #d9e4fb; color: var(--blue-dark); }
    .pill-cancelled { background: #ece8e1; color: var(--muted); }
    .pill-queued { background: #fff4d6; color: var(--gold-dark); }

    .order-actions {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.45rem;
      margin-top: 0.75rem;
      align-items: stretch;
    }
    .btn {
      min-height: 48px;
      padding: 0.55rem 0.9rem;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .btn-paid { background: var(--pine); color: #fff; flex: 1 1 0; min-width: 0; }
    .btn-picked { background: var(--blue); color: #fff; flex: 1 1 0; min-width: 0; }
    .btn-more {
      background: var(--cream-deep);
      color: var(--ink);
      min-width: 48px;
    }
    .more-wrap { position: relative; }
    .btn-primary {
      background: var(--maroon);
      color: #fff;
      width: 100%;
      font-size: 1.05rem;
    }
    .btn-ghost {
      background: transparent;
      color: var(--maroon);
      border: 1.5px solid var(--maroon);
    }
    .menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 6px);
      min-width: 160px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(42, 35, 6, 0.18);
      padding: 0.3rem;
      display: none;
      z-index: 6;
    }
    .menu.is-open { display: block; }
    .menu button {
      display: block;
      width: 100%;
      text-align: left;
      min-height: 44px;
      padding: 0.4rem 0.7rem;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-weight: 700;
    }
    .menu button:hover, .menu button:focus-visible { background: var(--cream); }
    .menu .danger { color: var(--maroon); }

    .item-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }
    .item-btn {
      min-height: 72px;
      text-align: left;
      border-radius: 14px;
      border: 2px solid var(--cream-deep);
      background: var(--cream-light);
      padding: 0.65rem 0.7rem;
      box-shadow: var(--shadow);
    }
    .item-btn .iname { display: block; font-weight: 800; font-size: 0.88rem; line-height: 1.25; }
    .item-btn .iprice { display: block; margin-top: 0.2rem; color: var(--maroon); font-weight: 800; }
    .item-btn[aria-pressed="true"] {
      border-color: var(--maroon);
      background: #f6e7e4;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin: 0 0 0.7rem;
    }
    .row label, .field-label {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .stepper { display: flex; align-items: center; gap: 0.35rem; }
    .stepper button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: var(--maroon);
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1;
    }
    .stepper input {
      width: 56px;
      height: 48px;
      text-align: center;
      border-radius: 12px;
      border: 1.5px solid var(--cream-deep);
      background: var(--cream-light);
      font-weight: 800;
      font-size: 1.1rem;
    }
    .mass-select {
      min-height: 48px;
      border-radius: 12px;
      border: 1.5px solid var(--cream-deep);
      background: var(--cream-light);
      padding: 0 0.7rem;
      font-weight: 700;
      min-width: 0;
      flex: 1;
    }
    .pay-toggle { display: flex; gap: 0.4rem; }
    .pay-toggle button {
      min-height: 48px;
      min-width: 72px;
      padding: 0.4rem 0.9rem;
      border-radius: 12px;
      border: 2px solid var(--cream-deep);
      background: var(--cream-light);
      font-weight: 800;
    }
    .pay-toggle button[aria-pressed="true"] {
      background: var(--pine);
      border-color: var(--pine);
      color: #fff;
    }
    .live-amount {
      margin: 0.2rem 0 0.85rem;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--maroon);
    }

    .walkin-amount { font-weight: 800; color: var(--maroon); }
    .undo-btn {
      min-height: 44px;
      min-width: 72px;
      border: none;
      border-radius: 10px;
      background: var(--cream-deep);
      color: var(--maroon);
      font-weight: 800;
    }

    /* PIN gate */
    .pin-gate {
      position: fixed;
      inset: 0;
      background: var(--cream);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.4rem 1.2rem;
    }
    .pin-gate[hidden] { display: none !important; }
    .pin-card {
      width: 100%;
      max-width: 360px;
      background: var(--cream-light);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 1.3rem 1.15rem 1.2rem;
      text-align: center;
    }
    .pin-card img { width: 72px; height: 72px; }
    .pin-card h2 {
      margin: 0.6rem 0 0.2rem;
      font-family: var(--serif);
      color: var(--blue);
      font-size: 1.35rem;
    }
    .pin-card p { margin: 0 0 0.9rem; color: var(--muted); font-size: 0.92rem; }
    .pin-card input {
      width: 100%;
      min-height: 56px;
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 0.35em;
      border-radius: 12px;
      border: 1.5px solid var(--cream-deep);
      background: #fff;
      margin-bottom: 0.7rem;
    }
    .pin-error { min-height: 1.3em; margin: 0.5rem 0 0; color: var(--maroon); font-weight: 700; font-size: 0.88rem; }

    .toast-wrap {
      position: fixed;
      left: 50%;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(420px, calc(100% - 1.4rem));
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      pointer-events: none;
    }
    .toast {
      pointer-events: none;
      background: var(--ink);
      color: #fff;
      padding: 0.75rem 0.95rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.92rem;
      box-shadow: var(--shadow);
    }
    .toast.error { background: var(--maroon); }
    .toast.ok { background: var(--pine); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(42, 35, 6, 0.45);
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }
    .modal-backdrop[hidden] { display: none !important; }
    .modal {
      width: min(360px, 100%);
      background: var(--cream-light);
      border-radius: 18px;
      padding: 1.15rem 1.05rem 1rem;
      box-shadow: 0 16px 40px rgba(42, 35, 6, 0.22);
    }
    .modal h2 { margin: 0 0 0.4rem; font-size: 1.15rem; color: var(--maroon); }
    .modal p { margin: 0 0 1rem; color: var(--ink); }
    .modal-actions { display: flex; gap: 0.5rem; }
    .modal-actions .btn { flex: 1; }


    /* Desktop / tablet: use the width instead of a phone column. */
    @media (min-width: 720px) {
      .app { max-width: 1100px; }
      header.hero-head { padding-left: 1.4rem; padding-right: 1.4rem; }
      header.hero-head h1 { font-size: 1.3rem; }
      .tabs { padding: 0.9rem 1.4rem 0; max-width: 420px; }
      .page { padding: 1rem 1.4rem 2rem; }
      .counts { grid-template-columns: repeat(3, minmax(0, 220px)); gap: 0.8rem; }
      .search { max-width: 420px; }
      .chips { flex-wrap: wrap; overflow-x: visible; }
      .order-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem; align-items: start; }
      .walkin-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.6rem; align-items: start; }
      .walkin-side .updated { margin-top: 0 !important; }
      .item-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .btn-primary { max-width: 360px; }
    }
    @media (min-width: 1000px) {
      .order-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (hover: hover) {
      .chip:hover, .item-btn:hover { border-color: var(--gold); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero-head">
      <img class="logo" src="logo.png" width="52" height="52" alt="Vailankanni Parish Youth logo">
      <div class="brand">
        <h1>Vailankanni Parish Youth</h1>
        <p class="tagline">Staff desk • Christmas Cake Sale</p>
      </div>
      <button type="button" class="lock-btn" id="lock-btn">Lock</button>
    </header>
    <p class="example-banner" id="example-banner">Example data — not live orders</p>
    <div class="tabs" role="tablist" aria-label="Staff tasks">
      <button type="button" class="tab-btn" id="tab-orders" role="tab" aria-selected="true" aria-controls="panel-orders">Orders</button>
      <button type="button" class="tab-btn" id="tab-walkin" role="tab" aria-selected="false" aria-controls="panel-walkin">Walk-in sale</button>
    </div>
    <main class="page">
      <section class="panel" id="panel-orders" role="tabpanel" aria-labelledby="tab-orders">
        <div class="chips" id="date-chips" aria-label="Pickup date"></div>
        <div class="chips" id="mass-chips" aria-label="Mass"></div>
        <label class="visually-hidden" for="search" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Search orders</label>
        <input class="search" id="search" type="search" placeholder="Search name, phone, or order ID" autocomplete="off" enterkeyhint="search">
        <div class="counts" aria-label="Totals">
          <article class="count-card">
            <p class="label">To collect</p>
            <p class="value" id="count-collect">0</p>
            <p class="sub" id="count-collect-amt">₹0</p>
          </article>
          <article class="count-card">
            <p class="label">Picked up</p>
            <p class="value" id="count-picked">0</p>
          </article>
          <article class="count-card">
            <p class="label">Pending</p>
            <p class="value" id="count-pending">0</p>
          </article>
        </div>
        <p class="updated" id="orders-updated">Sign in to load orders.</p>
        <div class="order-list" id="order-list"></div>
      </section>
      <section class="panel" id="panel-walkin" role="tabpanel" aria-labelledby="tab-walkin" hidden>
        <div class="walkin-layout">
        <div class="walkin-form">
        <div class="chips" id="walkin-date-chips" aria-label="Sale date"></div>
        <div class="item-grid" id="item-grid"></div>
        <div class="row">
          <span class="field-label">Quantity</span>
          <div class="stepper">
            <button type="button" id="qty-minus" aria-label="Decrease quantity">−</button>
            <input id="qty" type="number" inputmode="numeric" min="1" max="99" value="1" aria-label="Quantity">
            <button type="button" id="qty-plus" aria-label="Increase quantity">+</button>
          </div>
        </div>
        <div class="row">
          <label class="field-label" for="walkin-mass">Mass</label>
          <select class="mass-select" id="walkin-mass">
            <option value="6:30 AM Mass">6:30 AM Mass</option>
            <option value="8:30 AM Mass">8:30 AM Mass</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="row">
          <span class="field-label">Payment</span>
          <div class="pay-toggle" role="group" aria-label="Payment">
            <button type="button" id="pay-cash" aria-pressed="true">Cash</button>
            <button type="button" id="pay-upi" aria-pressed="false">UPI</button>
          </div>
        </div>
        <p class="live-amount" id="live-amount">₹0</p>
        <button type="button" class="btn btn-primary" id="record-sale">Record sale</button>
        </div>
        <div class="walkin-side">
        <p class="updated" id="walkin-updated" style="margin-top:1rem;">Recent walk-ins</p>
        <div class="walkin-list" id="walkin-list"></div>
        </div>
        </div>
      </section>
    </main>
  </div>

  <div class="pin-gate" id="pin-gate">
    <form class="pin-card" id="pin-form">
      <img src="logo.png" width="72" height="72" alt="">
      <h2>Staff PIN</h2>
      <p>Enter the organiser PIN to mark payments and log walk-in sales.</p>
      <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" aria-label="Staff PIN" required>
      <button type="submit" class="btn btn-primary" id="pin-submit">Unlock</button>
      <p class="pin-error" id="pin-error" role="alert"></p>
    </form>
  </div>

  <div class="modal-backdrop" id="confirm-modal" hidden>
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <h2 id="confirm-title">Cancel this order?</h2>
      <p id="confirm-body"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="confirm-no">Keep</button>
        <button type="button" class="btn btn-primary" id="confirm-yes">Cancel order</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="site-config.js"></script>
  <script>
(function () {
  const SHEETS_WEBAPP_URL = (window.SITE_CONFIG && window.SITE_CONFIG.appsScriptUrl) || 'https://script.google.com/macros/s/AKfycbyweMtzB7WrgSSzwBczduVaOAZ5dfYHLXBlJoUCU5bj7cU08IzLRfv7r2UpbJsAQyGs/exec';
  const PIN_KEY = 'poppinsStaffPin';
  const TOKEN_KEY = 'poppinsStaffClientToken';
  const OUTBOX_KEY = 'poppinsStaffOutbox';
  const OUTBOX_POST_MS = 12000;
  const OUTBOX_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000;
  const REFRESH_MS = 30000;
  const SEARCH_DEBOUNCE_MS = 280;

  const MENU = [
    { name: 'Dates & Carrot Pudding (700g)', short: 'Dates 700g', price: 650 },
    { name: 'Dates & Carrot Pudding (350g)', short: 'Dates 350g', price: 330 },
    { name: 'Butterscotch Pudding (700g)', short: 'Butterscotch 700g', price: 700 },
    { name: 'Butterscotch Pudding (350g)', short: 'Butterscotch 350g', price: 350 },
    { name: 'Rich Plum Cake (800g)', short: 'Plum 800g', price: 650 },
    { name: 'Rich Plum Cake (400g)', short: 'Plum 400g', price: 350 }
  ];
  const MASS_FILTERS = [
    { id: '', label: 'All Masses' },
    { id: '06:30', label: '6:30 AM' },
    { id: '08:30', label: '8:30 AM' }
  ];
  const DEFAULT_DATES = [
    { id: '2026-11-29', label: 'Sun, 29 Nov', closesAt: '2026-11-29T08:30:00+05:30' },
    { id: '2026-12-06', label: 'Sun, 6 Dec', closesAt: '2026-12-06T08:30:00+05:30' },
    { id: '2026-12-13', label: 'Sun, 13 Dec', closesAt: '2026-12-13T08:30:00+05:30' },
    { id: '2026-12-20', label: 'Sun, 20 Dec', closesAt: '2026-12-20T08:30:00+05:30' }
  ];

  const MOCK_ORDERS = [
    { row: 2, orderId: 'PB-261123-HVAB', name: "Anita D'Souza", phone: '9876543210', mass: '06:30', pickupDate: '2026-11-29', items: '1 × Dates & Carrot Pudding (700g)\n2 × Rich Plum Cake (400g)', total: 1350, status: 'Pending' },
    { row: 3, orderId: 'PB-261123-KLMN', name: 'Cyril Martin', phone: '7204017793', mass: '08:30', pickupDate: '2026-11-29', items: '1 × Butterscotch Pudding (700g)', total: 700, status: 'Paid' },
    { row: 4, orderId: 'PB-261123-QRST', name: 'Maria Fernandes', phone: '9988776655', mass: '06:30', pickupDate: '2026-11-29', items: '2 × Dates & Carrot Pudding (350g)\n1 × Rich Plum Cake (800g)', total: 1310, status: 'Picked up' },
    { row: 5, orderId: 'PB-261122-ABCD', name: 'Joseph Pinto', phone: '9123456780', mass: '08:30', pickupDate: '2026-11-29', items: '1 × Rich Plum Cake (400g)', total: 350, status: 'Pending' },
    { row: 6, orderId: 'PB-261122-WXYZ', name: 'Sunita Rao', phone: '9000011122', mass: '06:30', pickupDate: '2026-11-29', items: '1 × Butterscotch Pudding (350g)', total: 350, status: 'Cancelled' },
    { row: 7, orderId: 'PB-261121-EFGH', name: 'Rohan Naik', phone: '9811122233', mass: '08:30', pickupDate: '2026-12-06', items: '1 × Dates & Carrot Pudding (700g)', total: 650, status: 'Pending' }
  ];
  const MOCK_WALKINS = [
    { walkinId: 'WI-demo-1', date: '2026-11-29', mass: '8:30 AM Mass', item: 'Dates & Carrot Pudding (700g)', qty: 1, price: 650, amount: 650, payment: 'Cash', notes: '', voided: false },
    { walkinId: 'WI-demo-2', date: '2026-11-29', mass: '8:30 AM Mass', item: 'Rich Plum Cake (400g)', qty: 2, price: 350, amount: 700, payment: 'UPI', notes: '', voided: false }
  ];

  const params = new URLSearchParams(location.search);
  const isPreview = params.get('preview') === '1' || params.get('preview') === 'true';
  if (isPreview) document.body.classList.add('is-preview');

  const state = {
    pin: '',
    unlocked: false,
    tab: params.get('tab') === 'walkin' ? 'walkin' : 'orders',
    pickupDate: '2026-11-29',
    mass: '',
    q: '',
    orders: [],
    walkins: [],
    dates: DEFAULT_DATES.slice(),
    counts: { toCollect: 0, toCollectAmount: 0, pickedUp: 0, pending: 0, total: 0 },
    item: '',
    qty: 1,
    walkinMass: '8:30 AM Mass',
    payment: 'Cash',
    lastOrdersAt: '',
    loading: false,
    ordersReq: 0,
    walkinsReq: 0
  };

  function $(id) { return document.getElementById(id); }

  function rupee(n) {
    const v = Math.round(Number(n) || 0);
    return '₹' + v.toLocaleString('en-IN');
  }

  function shortItem(name) {
    const hit = MENU.find(function (m) { return m.name === name; });
    return hit ? hit.short : name;
  }

  function itemPrice(name) {
    const hit = MENU.find(function (m) { return m.name === name; });
    return hit ? hit.price : 0;
  }

  function telHref(phone) {
    const digits = String(phone || '').replace(/\D/g, '');
    if (!digits) return '';
    if (digits.length === 10) return 'tel:+91' + digits;
    if (digits.indexOf('91') === 0 && digits.length === 12) return 'tel:+' + digits;
    return 'tel:' + digits;
  }

  function formatPhone(phone) {
    const digits = String(phone || '').replace(/\D/g, '');
    if (digits.length === 10) return '+91 ' + digits.slice(0, 5) + ' ' + digits.slice(5);
    return String(phone || '');
  }

  function dateLabel(id) {
    const hit = state.dates.find(function (d) { return d.id === id; });
    if (hit) return hit.label || hit.display || id;
    return id;
  }

  function pillClass(status) {
    if (status === 'Paid') return 'pill pill-paid';
    if (status === 'Picked up') return 'pill pill-picked';
    if (status === 'Cancelled') return 'pill pill-cancelled';
    return 'pill pill-pending';
  }

  function toast(msg, kind) {
    const wrap = $('toasts');
    const el = document.createElement('div');
    el.className = 'toast' + (kind === 'error' ? ' error' : kind === 'ok' ? ' ok' : '');
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function () { el.remove(); }, 3200);
  }

  function getClientToken() {
    try {
      let t = localStorage.getItem(TOKEN_KEY);
      if (t && t.length >= 8) return t;
      t = 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(TOKEN_KEY, t);
      return t;
    } catch (err) {
      return 'anon-local';
    }
  }

  function readPin() {
    try { return sessionStorage.getItem(PIN_KEY) || ''; } catch (err) { return ''; }
  }
  function writePin(pin) {
    try {
      if (pin) sessionStorage.setItem(PIN_KEY, pin);
      else sessionStorage.removeItem(PIN_KEY);
    } catch (err) {}
  }

  function readOutbox() {
    try {
      const raw = localStorage.getItem(OUTBOX_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (err) { return []; }
  }
  function writeOutbox(list) {
    try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list || [])); } catch (err) {}
  }
  function upsertOutbox(entry) {
    if (!entry || !entry.id) return;
    const list = readOutbox();
    const i = list.findIndex(function (e) { return e && e.id === entry.id; });
    if (i >= 0) list[i] = Object.assign({}, list[i], entry);
    else list.push(Object.assign({ queuedAt: Date.now(), attempts: 0, nextAttemptAt: 0 }, entry));
    writeOutbox(list);
  }
  function removeOutbox(id) {
    writeOutbox(readOutbox().filter(function (e) { return !(e && e.id === id); }));
  }
  function outboxBackoffMs(attempts) {
    return Math.min(60000, 1000 * Math.pow(2, Math.max(0, (attempts || 1) - 1)));
  }

  async function readJsonResponse(res) {
    const text = await res.text();
    try { return JSON.parse(text); } catch (err) { return { ok: false, error: text || 'Bad response' }; }
  }

  async function staffPost(payload) {
    if (isPreview) return previewHandle(payload);
    const body = Object.assign({}, payload, {
      pin: state.pin,
      clientToken: getClientToken()
    });
    const controller = new AbortController();
    const timer = setTimeout(function () { controller.abort(); }, OUTBOX_POST_MS);
    try {
      const res = await fetch(SHEETS_WEBAPP_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(body),
        keepalive: true,
        signal: controller.signal
      });
      return await readJsonResponse(res);
    } finally {
      clearTimeout(timer);
    }
  }

  function previewHandle(payload) {
    const action = payload && payload.action;
    if (action === 'staff_login') return Promise.resolve({ ok: true, status: 'ok', version: '2026-11-23.11' });
    if (action === 'staff_orders') {
      const date = payload.pickupDate || state.pickupDate;
      const mass = payload.mass || '';
      const q = String(payload.q || '').trim().toLowerCase();
      const qDigits = q.replace(/\D/g, '');
      let orders = MOCK_ORDERS.filter(function (o) { return o.pickupDate === date; });
      if (mass) orders = orders.filter(function (o) { return o.mass === mass; });
      if (q) {
        const qIsNumeric = qDigits.length > 0 && q.replace(/[\s\-()+]/g, '') === qDigits;
        orders = orders.filter(function (o) {
          const phone = String(o.phone).replace(/\D/g, '');
          return o.name.toLowerCase().indexOf(q) !== -1 ||
            o.orderId.toLowerCase().indexOf(q) !== -1 ||
            (qIsNumeric && phone.slice(-qDigits.length) === qDigits);
        });
      }
      return Promise.resolve({
        ok: true,
        pickupDate: date,
        mass: mass,
        orders: orders.map(function (o) { return Object.assign({}, o); }),
        counts: countsFrom(orders),
        dates: DEFAULT_DATES.slice(),
        version: '2026-11-23.11'
      });
    }
    if (action === 'staff_set_status') {
      const order = MOCK_ORDERS.find(function (o) { return o.orderId === payload.orderId; });
      if (!order) return Promise.resolve({ ok: false, status: 'not_found', error: 'Order not found' });
      if (payload.expectedStatus && order.status !== payload.expectedStatus) {
        return Promise.resolve({ ok: false, status: 'conflict', error: 'Status changed', currentStatus: order.status, orderId: order.orderId });
      }
      order.status = payload.status;
      return Promise.resolve({ ok: true, status: order.status, orderId: order.orderId, previousStatus: payload.expectedStatus });
    }
    if (action === 'staff_walkins') {
      const date = payload.date || state.pickupDate;
      const list = MOCK_WALKINS.filter(function (w) { return w.date === date && !w.voided; }).map(function (w) { return Object.assign({}, w); });
      return Promise.resolve({ ok: true, date: date, walkins: list });
    }
    if (action === 'staff_add_walkin') {
      const existing = MOCK_WALKINS.find(function (w) { return w.walkinId === payload.walkinId; });
      if (existing) return Promise.resolve({ ok: true, duplicate: true, walkinId: existing.walkinId, voided: !!existing.voided });
      const price = itemPrice(payload.item);
      const row = {
        walkinId: payload.walkinId,
        date: payload.date,
        mass: payload.mass,
        item: payload.item,
        qty: payload.qty,
        price: price,
        amount: price * payload.qty,
        payment: payload.payment,
        notes: payload.notes || '',
        voided: false
      };
      MOCK_WALKINS.unshift(row);
      return Promise.resolve(Object.assign({ ok: true }, row));
    }
    if (action === 'staff_delete_walkin') {
      const row = MOCK_WALKINS.find(function (w) { return w.walkinId === payload.walkinId; });
      if (!row) return Promise.resolve({ ok: false, status: 'not_found', error: 'Walk-in not found' });
      row.voided = true;
      return Promise.resolve({ ok: true, walkinId: row.walkinId, voided: true });
    }
    return Promise.resolve({ ok: false, error: 'Unknown action' });
  }

  function countsFrom(orders) {
    const c = { toCollect: 0, toCollectAmount: 0, pickedUp: 0, pending: 0, total: orders.length };
    orders.forEach(function (o) {
      if (o.status === 'Picked up') c.pickedUp += 1;
      else if (o.status !== 'Cancelled') {
        c.pending += 1;
        if (o.status !== 'Paid') {
          c.toCollect += 1;
          c.toCollectAmount += Number(o.total) || 0;
        }
      }
    });
    return c;
  }

  function applyOutboxToOrders(orders) {
    const pending = readOutbox().filter(function (e) { return e && e.type === 'status' && e.orderId; });
    return (orders || []).map(function (o) {
      const hit = pending.find(function (e) { return e.orderId === o.orderId; });
      if (!hit) return o;
      return Object.assign({}, o, { status: hit.status, _queued: true });
    });
  }

  function applyOutboxToWalkins(list) {
    const box = readOutbox();
    let next = (list || []).slice();
    box.forEach(function (e) {
      if (!e) return;
      if (e.type === 'walkin' && e.payload) {
        const exists = next.some(function (w) { return w.walkinId === e.payload.walkinId; });
        if (!exists && e.payload.date === state.pickupDate) {
          const price = itemPrice(e.payload.item);
          next.unshift({
            walkinId: e.payload.walkinId,
            date: e.payload.date,
            mass: e.payload.mass,
            item: e.payload.item,
            qty: e.payload.qty,
            price: price,
            amount: price * e.payload.qty,
            payment: e.payload.payment,
            notes: e.payload.notes || '',
            voided: false,
            _queued: true
          });
        }
      }
      if (e.type === 'void' && e.walkinId) {
        next = next.filter(function (w) { return w.walkinId !== e.walkinId; });
      }
    });
    return next;
  }

  function renderDates(targetId) {
    const el = $(targetId);
    el.innerHTML = state.dates.map(function (d) {
      const pressed = d.id === state.pickupDate ? 'true' : 'false';
      return '<button type="button" class="chip" data-date="' + d.id + '" aria-pressed="' + pressed + '">' +
        (d.label || d.display || d.id) + '</button>';
    }).join('');
  }

  function renderMassChips() {
    $('mass-chips').innerHTML = MASS_FILTERS.map(function (m) {
      const pressed = m.id === state.mass ? 'true' : 'false';
      return '<button type="button" class="chip" data-mass="' + m.id + '" aria-pressed="' + pressed + '">' + m.label + '</button>';
    }).join('');
  }

  function renderCounts() {
    const c = state.counts || countsFrom(state.orders);
    $('count-collect').textContent = String(c.toCollect || 0);
    $('count-collect-amt').textContent = rupee(c.toCollectAmount || 0);
    $('count-picked').textContent = String(c.pickedUp || 0);
    $('count-pending').textContent = String(c.pending || 0);
  }

  function renderOrders() {
    const list = $('order-list');
    const orders = applyOutboxToOrders(state.orders);
    if (!orders.length) {
      list.innerHTML = '<p class="empty">No orders for this date' + (state.q ? ' and search' : '') + '.</p>';
      renderCounts();
      return;
    }
    list.innerHTML = orders.map(function (o) {
      const href = telHref(o.phone);
      const phoneHtml = href
        ? '<a class="phone-link" href="' + href + '">' + formatPhone(o.phone) + '</a>'
        : '';
      const queued = o._queued ? ' <span class="pill pill-queued">Queued</span>' : '';
      const more = statusMenuButtons(o);
      let actions = '';
      if (o.status === 'Pending') {
        actions += '<button type="button" class="btn btn-paid" data-act="Paid" data-id="' + o.orderId + '">Mark Paid</button>';
        actions += '<button type="button" class="btn btn-picked" data-act="Picked up" data-id="' + o.orderId + '">Picked up</button>';
      } else if (o.status === 'Paid') {
        actions += '<button type="button" class="btn btn-picked" data-act="Picked up" data-id="' + o.orderId + '">Picked up</button>';
      }
      actions += '<span class="more-wrap"><button type="button" class="btn btn-more" data-menu="' + o.orderId + '" aria-haspopup="true" aria-label="More status options">⋯</button>' + more + '</span>';
      return '<article class="order-card" data-order="' + o.orderId + '" data-status="' + o.status + '">' +
        '<div class="order-top"><div>' +
        '<p class="order-name">' + escapeHtml(o.name || '') + '</p>' +
        '<p class="order-meta">' + (o.mass === '06:30' ? '6:30 AM Mass' : o.mass === '08:30' ? '8:30 AM Mass' : escapeHtml(o.mass || '')) +
        (phoneHtml ? ' · ' + phoneHtml : '') +
        (o.assignedTo ? ' · To: ' + escapeHtml(o.assignedTo) : '') + '</p>' +
        '</div><span class="' + pillClass(o.status) + '">' + escapeHtml(o.status) + '</span>' + queued + '</div>' +
        '<p class="order-items">' + escapeHtml(o.items || '') + '</p>' +
        '<p class="order-total">' + rupee(o.total) + '</p>' +
        '<div class="order-actions">' + actions + '</div>' +
        '</article>';
    }).join('');
    renderCounts();
  }

  function statusMenuButtons(o) {
    const opts = [];
    if (o.status !== 'Pending') opts.push('<button type="button" data-act="Pending" data-id="' + o.orderId + '">Pending</button>');
    if (o.status !== 'Cancelled') opts.push('<button type="button" class="danger" data-act="Cancelled" data-id="' + o.orderId + '">Cancelled</button>');
    return '<div class="menu" id="menu-' + o.orderId + '">' + opts.join('') + '</div>';
  }

  function renderWalkinForm() {
    $('item-grid').innerHTML = MENU.map(function (m) {
      const pressed = state.item === m.name ? 'true' : 'false';
      return '<button type="button" class="item-btn" data-item="' + escapeAttr(m.name) + '" aria-pressed="' + pressed + '">' +
        '<span class="iname">' + escapeHtml(m.short) + '</span>' +
        '<span class="iprice">' + rupee(m.price) + '</span></button>';
    }).join('');
    $('qty').value = String(state.qty);
    $('walkin-mass').value = state.walkinMass;
    $('pay-cash').setAttribute('aria-pressed', state.payment === 'Cash' ? 'true' : 'false');
    $('pay-upi').setAttribute('aria-pressed', state.payment === 'UPI' ? 'true' : 'false');
    const amount = state.item ? itemPrice(state.item) * state.qty : 0;
    $('live-amount').textContent = rupee(amount);
    $('record-sale').disabled = !state.item;
  }

  function renderWalkins() {
    const list = $('walkin-list');
    const rows = applyOutboxToWalkins(state.walkins).filter(function (w) { return !w.voided; });
    if (!rows.length) {
      list.innerHTML = '<p class="empty">No walk-in sales for ' + escapeHtml(dateLabel(state.pickupDate)) + ' yet.</p>';
      return;
    }
    list.innerHTML = rows.map(function (w) {
      const queued = w._queued ? ' <span class="pill pill-queued">Queued</span>' : '';
      return '<article class="walkin-card" data-walkin="' + escapeAttr(w.walkinId) + '">' +
        '<div class="walkin-top"><div>' +
        '<p class="walkin-item">' + w.qty + ' × ' + escapeHtml(shortItem(w.item)) + '</p>' +
        '<p class="walkin-meta">' + escapeHtml(w.mass || '') + ' · ' + escapeHtml(w.payment || '') + queued + '</p>' +
        '</div><div><p class="walkin-amount">' + rupee(w.amount) + '</p>' +
        '<button type="button" class="undo-btn" data-undo="' + escapeAttr(w.walkinId) + '">Undo</button></div></div>' +
        '</article>';
    }).join('');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (ch) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
    });
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function setTab(tab) {
    state.tab = tab === 'walkin' ? 'walkin' : 'orders';
    $('tab-orders').setAttribute('aria-selected', state.tab === 'orders' ? 'true' : 'false');
    $('tab-walkin').setAttribute('aria-selected', state.tab === 'walkin' ? 'true' : 'false');
    $('panel-orders').hidden = state.tab !== 'orders';
    $('panel-walkin').hidden = state.tab !== 'walkin';
    if (state.tab === 'walkin') return loadWalkins();
  }

  function showPin(show, message) {
    $('pin-gate').hidden = !show;
    if (message) $('pin-error').textContent = message;
    if (show) {
      state.unlocked = false;
      setTimeout(function () { $('pin-input').focus(); }, 30);
    }
  }

  async function login(pin) {
    const given = String(pin || '').trim();
    if (!/^\d{4,}$/.test(given) && !isPreview) {
      $('pin-error').textContent = 'Enter at least 4 digits.';
      return { ok: false, error: 'Enter at least 4 digits.' };
    }
    state.pin = given || (isPreview ? '0000' : '');
    const res = await staffPost({ action: 'staff_login', pin: state.pin, clientToken: getClientToken() });
    if (res && res.ok) {
      writePin(state.pin);
      state.unlocked = true;
      $('pin-error').textContent = '';
      showPin(false);
      await loadOrders();
      await loadWalkins();
      flushOutbox();
      return res;
    }
    state.unlocked = false;
    writePin('');
    state.pin = '';
    const msg = (res && res.status === 'locked')
      ? (res.error || 'Too many attempts. Try again later.')
      : (res && res.status === 'pin_unset')
        ? (res.error || 'Staff PIN is not set yet.')
        : (res && res.error) || 'Wrong PIN.';
    $('pin-error').textContent = msg;
    return res || { ok: false, error: msg };
  }

  function logout() {
    state.pin = '';
    state.unlocked = false;
    writePin('');
    state.orders = [];
    state.walkins = [];
    renderOrders();
    renderWalkins();
    $('orders-updated').textContent = 'Locked.';
    showPin(true, '');
    $('pin-input').value = '';
  }

  async function loadOrders() {
    if (!state.unlocked && !isPreview) return;
    state.loading = true;
    const req = ++state.ordersReq;
    try {
      const res = await staffPost({
        action: 'staff_orders',
        pickupDate: state.pickupDate,
        mass: state.mass,
        q: state.q
      });
      if (!res || !res.ok) {
        if (res && (res.status === 'unauthorized' || res.status === 'locked' || res.status === 'pin_unset')) {
          logout();
          $('pin-error').textContent = res.error || 'Please sign in again.';
        } else {
          toast((res && res.error) || 'Could not load orders.', 'error');
        }
        return res;
      }
      if (req !== state.ordersReq) return res;
      if (res.dates && res.dates.length) state.dates = res.dates;
      if (res.pickupDate && !paramsHasExplicitDate()) {
        /* keep the staff-selected date; only adopt default when unset */
      }
      state.orders = res.orders || [];
      state.counts = res.counts || countsFrom(state.orders);
      state.lastOrdersAt = new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
      renderDates('date-chips');
      renderDates('walkin-date-chips');
      renderMassChips();
      renderOrders();
      $('orders-updated').textContent = state.lastOrdersAt
        ? 'Updated ' + state.lastOrdersAt + (readOutbox().length ? ' • syncing…' : '')
        : '';
      return res;
    } finally {
      state.loading = false;
    }
  }

  function paramsHasExplicitDate() { return false; }

  async function loadWalkins() {
    if (!state.unlocked && !isPreview) return;
    const req = ++state.walkinsReq;
    const res = await staffPost({ action: 'staff_walkins', date: state.pickupDate });
    if (req !== state.walkinsReq) return res;
    if (!res || !res.ok) {
      if (res && (res.status === 'unauthorized' || res.status === 'locked' || res.status === 'pin_unset')) {
        logout();
      }
      return res;
    }
    state.walkins = res.walkins || [];
    renderWalkins();
    return res;
  }

  async function setStatus(orderId, nextStatus, opts) {
    opts = opts || {};
    const order = state.orders.find(function (o) { return o.orderId === orderId; });
    if (!order) return { ok: false, error: 'Order not found' };
    const previous = order.status;
    if (previous === nextStatus) return { ok: true, status: nextStatus };
    order.status = nextStatus;
    state.counts = countsFrom(applyOutboxToOrders(state.orders));
    renderOrders();
    const id = 'st-' + orderId + '-' + nextStatus + '-' + Date.now();
    upsertOutbox({
      id: id,
      type: 'status',
      orderId: orderId,
      status: nextStatus,
      expectedStatus: previous,
      queuedAt: Date.now(),
      attempts: 0,
      nextAttemptAt: 0
    });
    try {
      const res = await staffPost({
        action: 'staff_set_status',
        orderId: orderId,
        status: nextStatus,
        expectedStatus: previous
      });
      if (res && res.ok) {
        removeOutbox(id);
        order.status = res.status || nextStatus;
        state.counts = countsFrom(state.orders);
        renderOrders();
        if (!opts.silent) toast('Marked ' + (res.status || nextStatus) + '.', 'ok');
        return res;
      }
      if (res && res.status === 'conflict') {
        removeOutbox(id);
        order.status = res.currentStatus || previous;
        state.counts = countsFrom(state.orders);
        renderOrders();
        toast('Updated elsewhere — now ' + (res.currentStatus || 'changed') + '.', 'error');
        await loadOrders();
        return res;
      }
      if (res && (res.status === 'unauthorized' || res.status === 'locked' || res.status === 'pin_unset')) {
        order.status = previous;
        removeOutbox(id);
        logout();
        return res;
      }
      toast('Saved on this phone — will retry when online.', 'error');
      return res || { ok: false, queued: true };
    } catch (err) {
      toast('Saved on this phone — will retry when online.', 'error');
      return { ok: false, queued: true, error: String(err && err.message || err) };
    }
  }

  function newWalkinId() {
    return 'WI-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  }

  async function addWalkin(opts) {
    opts = opts || {};
    if (!state.item) {
      toast('Choose an item first.', 'error');
      return { ok: false, error: 'Choose an item first.' };
    }
    const qty = Math.max(1, Math.floor(Number(opts.qty != null ? opts.qty : state.qty) || 1));
    const payload = {
      walkinId: opts.walkinId || newWalkinId(),
      date: state.pickupDate,
      mass: opts.mass || state.walkinMass,
      item: opts.item || state.item,
      qty: qty,
      payment: opts.payment || state.payment,
      notes: opts.notes || ''
    };
    const price = itemPrice(payload.item);
    const local = {
      walkinId: payload.walkinId,
      date: payload.date,
      mass: payload.mass,
      item: payload.item,
      qty: payload.qty,
      price: price,
      amount: price * payload.qty,
      payment: payload.payment,
      notes: payload.notes,
      voided: false,
      _queued: true
    };
    state.walkins = [local].concat(state.walkins);
    renderWalkins();
    upsertOutbox({
      id: payload.walkinId,
      type: 'walkin',
      payload: payload,
      walkinId: payload.walkinId,
      queuedAt: Date.now(),
      attempts: 0,
      nextAttemptAt: 0
    });
    try {
      const res = await staffPost(Object.assign({ action: 'staff_add_walkin' }, payload));
      if (res && res.ok) {
        removeOutbox(payload.walkinId);
        local._queued = false;
        if (res.amount) local.amount = res.amount;
        renderWalkins();
        if (!opts.silent) toast('Recorded ' + rupee(local.amount) + ' ' + local.payment + '.', 'ok');
        return res;
      }
      toast('Saved on this phone — will retry when online.', 'error');
      return res || { ok: false, queued: true };
    } catch (err) {
      toast('Saved on this phone — will retry when online.', 'error');
      return { ok: false, queued: true };
    }
  }

  async function voidWalkin(walkinId, opts) {
    opts = opts || {};
    const row = state.walkins.find(function (w) { return w.walkinId === walkinId; });
    if (row) row.voided = true;
    renderWalkins();
    upsertOutbox({
      id: 'void-' + walkinId,
      type: 'void',
      walkinId: walkinId,
      queuedAt: Date.now(),
      attempts: 0,
      nextAttemptAt: 0
    });
    try {
      const res = await staffPost({ action: 'staff_delete_walkin', walkinId: walkinId });
      if (res && res.ok) {
        removeOutbox('void-' + walkinId);
        if (!opts.silent) toast('Walk-in sale undone.', 'ok');
        return res;
      }
      toast('Undo queued — will retry when online.', 'error');
      return res || { ok: false, queued: true };
    } catch (err) {
      toast('Undo queued — will retry when online.', 'error');
      return { ok: false, queued: true };
    }
  }

  var outboxFlushPromise = null;
  async function flushOutbox(opts) {
    opts = opts || {};
    if (isPreview && !opts.forcePreview) {
      /* preview uses in-memory mock; still allow tests to call it */
    }
    if (!state.unlocked && !isPreview) return;
    if (outboxFlushPromise) {
      try { await outboxFlushPromise; } catch (err) {}
      if (!opts.force) return;
    }
    const run = (async function () {
      const now = Date.now();
      writeOutbox(readOutbox().filter(function (e) {
        return e && e.id && !(e.queuedAt && now - e.queuedAt > OUTBOX_MAX_AGE_MS);
      }));
      const due = readOutbox().filter(function (e) {
        return e && (opts.force || !e.nextAttemptAt || e.nextAttemptAt <= now);
      });
      for (var i = 0; i < due.length; i++) {
        const entry = due[i];
        try {
          var res;
          if (entry.type === 'status') {
            res = await staffPost({
              action: 'staff_set_status',
              orderId: entry.orderId,
              status: entry.status,
              expectedStatus: entry.expectedStatus
            });
            if (res && res.ok) removeOutbox(entry.id);
            else if (res && res.status === 'conflict') {
              removeOutbox(entry.id);
              toast('An order was updated elsewhere.', 'error');
              await loadOrders();
            } else {
              entry.attempts = (entry.attempts || 0) + 1;
              entry.nextAttemptAt = Date.now() + outboxBackoffMs(entry.attempts);
              upsertOutbox(entry);
            }
          } else if (entry.type === 'walkin' && entry.payload) {
            res = await staffPost(Object.assign({ action: 'staff_add_walkin' }, entry.payload));
            if (res && res.ok) removeOutbox(entry.id);
            else {
              entry.attempts = (entry.attempts || 0) + 1;
              entry.nextAttemptAt = Date.now() + outboxBackoffMs(entry.attempts);
              upsertOutbox(entry);
            }
          } else if (entry.type === 'void') {
            res = await staffPost({ action: 'staff_delete_walkin', walkinId: entry.walkinId });
            if (res && res.ok) removeOutbox(entry.id);
            else {
              entry.attempts = (entry.attempts || 0) + 1;
              entry.nextAttemptAt = Date.now() + outboxBackoffMs(entry.attempts);
              upsertOutbox(entry);
            }
          }
        } catch (err) {
          entry.attempts = (entry.attempts || 0) + 1;
          entry.nextAttemptAt = Date.now() + outboxBackoffMs(entry.attempts);
          upsertOutbox(entry);
        }
      }
    })();
    outboxFlushPromise = run;
    try { await run; } finally { outboxFlushPromise = null; }
  }

  var pendingConfirm = null;
  function askCancel(order) {
    pendingConfirm = order;
    $('confirm-title').textContent = 'Cancel this order?';
    $('confirm-body').textContent = 'Mark ' + (order.name || 'this order') + ' as cancelled? You can set it back to Pending later.';
    $('confirm-modal').hidden = false;
    $('confirm-yes').focus();
  }
  function closeConfirm() {
    $('confirm-modal').hidden = true;
    pendingConfirm = null;
  }

  async function handleStatusClick(orderId, nextStatus) {
    const order = state.orders.find(function (o) { return o.orderId === orderId; });
    if (!order) return;
    if (nextStatus === 'Cancelled') {
      askCancel(order);
      return;
    }
    return setStatus(orderId, nextStatus);
  }

  function closeMenus(exceptId) {
    Array.prototype.forEach.call(document.querySelectorAll('.menu.is-open'), function (el) {
      if (exceptId && el.id === exceptId) return;
      el.classList.remove('is-open');
    });
  }

  function bindEvents() {
    $('tab-orders').addEventListener('click', function () { setTab('orders'); });
    $('tab-walkin').addEventListener('click', function () { setTab('walkin'); });
    $('lock-btn').addEventListener('click', logout);
    $('pin-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      login($('pin-input').value);
    });
    $('date-chips').addEventListener('click', onDateClick);
    $('walkin-date-chips').addEventListener('click', onDateClick);
    $('mass-chips').addEventListener('click', function (ev) {
      const btn = ev.target.closest('[data-mass]');
      if (!btn) return;
      state.mass = btn.getAttribute('data-mass') || '';
      renderMassChips();
      loadOrders();
    });
    var searchTimer = null;
    $('search').addEventListener('input', function () {
      const value = $('search').value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        state.q = value.trim();
        loadOrders();
      }, SEARCH_DEBOUNCE_MS);
    });
    $('order-list').addEventListener('click', function (ev) {
      const menuBtn = ev.target.closest('[data-menu]');
      if (menuBtn && ev.target.closest('[data-menu]') === menuBtn && !ev.target.closest('[data-act]')) {
        const id = 'menu-' + menuBtn.getAttribute('data-menu');
        const menu = document.getElementById(id);
        const open = menu && !menu.classList.contains('is-open');
        closeMenus(id);
        if (menu && open) menu.classList.add('is-open');
        ev.stopPropagation();
        return;
      }
      const act = ev.target.closest('[data-act]');
      if (act) {
        closeMenus();
        handleStatusClick(act.getAttribute('data-id'), act.getAttribute('data-act'));
      }
    });
    document.addEventListener('click', function () { closeMenus(); });
    $('confirm-no').addEventListener('click', closeConfirm);
    $('confirm-yes').addEventListener('click', function () {
      const order = pendingConfirm;
      closeConfirm();
      if (order) setStatus(order.orderId, 'Cancelled');
    });
    $('confirm-modal').addEventListener('click', function (ev) {
      if (ev.target === $('confirm-modal')) closeConfirm();
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') closeConfirm();
    });

    $('item-grid').addEventListener('click', function (ev) {
      const btn = ev.target.closest('[data-item]');
      if (!btn) return;
      state.item = btn.getAttribute('data-item');
      renderWalkinForm();
    });
    $('qty-minus').addEventListener('click', function () {
      state.qty = Math.max(1, state.qty - 1);
      renderWalkinForm();
    });
    $('qty-plus').addEventListener('click', function () {
      state.qty = Math.min(99, state.qty + 1);
      renderWalkinForm();
    });
    $('qty').addEventListener('change', function () {
      state.qty = Math.max(1, Math.min(99, Math.floor(Number($('qty').value) || 1)));
      renderWalkinForm();
    });
    $('walkin-mass').addEventListener('change', function () {
      state.walkinMass = $('walkin-mass').value;
    });
    $('pay-cash').addEventListener('click', function () { state.payment = 'Cash'; renderWalkinForm(); });
    $('pay-upi').addEventListener('click', function () { state.payment = 'UPI'; renderWalkinForm(); });
    $('record-sale').addEventListener('click', function () { addWalkin(); });
    $('walkin-list').addEventListener('click', function (ev) {
      const btn = ev.target.closest('[data-undo]');
      if (!btn) return;
      voidWalkin(btn.getAttribute('data-undo'));
    });
  }

  function onDateClick(ev) {
    const btn = ev.target.closest('[data-date]');
    if (!btn) return;
    state.pickupDate = btn.getAttribute('data-date');
    renderDates('date-chips');
    renderDates('walkin-date-chips');
    loadOrders();
    loadWalkins();
  }

  var refreshTimer = null;
  function startRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function () {
      if (document.hidden) return;
      if (!state.unlocked && !isPreview) return;
      flushOutbox();
      loadOrders();
      if (state.tab === 'walkin') loadWalkins();
    }, REFRESH_MS);
  }

  async function boot() {
    bindEvents();
    renderDates('date-chips');
    renderDates('walkin-date-chips');
    renderMassChips();
    renderWalkinForm();
    renderOrders();
    renderWalkins();
    setTab(state.tab);
    startRefresh();
    window.addEventListener('pageshow', function () { flushOutbox(); });
    window.addEventListener('online', function () { flushOutbox({ force: true }); });

    if (isPreview) {
      state.unlocked = true;
      showPin(false);
      await login('0000');
      if (state.tab === 'walkin') {
        state.item = MENU[0].name;
        state.qty = 1;
        state.payment = 'Cash';
        renderWalkinForm();
      }
      return;
    }
    const stored = readPin();
    if (stored) {
      showPin(false);
      const res = await login(stored);
      if (res && res.ok) return;
    }
    showPin(true);
  }

  window.__staff = {
    login: login,
    logout: logout,
    loadOrders: loadOrders,
    loadWalkins: loadWalkins,
    setTab: setTab,
    setDate: function (id) {
      state.pickupDate = id;
      renderDates('date-chips');
      renderDates('walkin-date-chips');
      return loadOrders().then(function () { return loadWalkins(); });
    },
    setMass: function (id) { state.mass = id; renderMassChips(); return loadOrders(); },
    search: function (q) { state.q = q; $('search').value = q; return loadOrders(); },
    setStatus: setStatus,
    addWalkin: addWalkin,
    voidWalkin: voidWalkin,
    setItem: function (name) { state.item = name; renderWalkinForm(); },
    setQty: function (n) { state.qty = n; renderWalkinForm(); },
    setPayment: function (p) { state.payment = p; renderWalkinForm(); },
    flushOutbox: flushOutbox,
    getState: function () {
      return {
        pin: state.pin,
        unlocked: state.unlocked,
        tab: state.tab,
        pickupDate: state.pickupDate,
        mass: state.mass,
        q: state.q,
        orders: applyOutboxToOrders(state.orders),
        walkins: applyOutboxToWalkins(state.walkins),
        counts: state.counts,
        item: state.item,
        qty: state.qty,
        payment: state.payment,
        walkinMass: state.walkinMass,
        outbox: readOutbox(),
        isPreview: isPreview
      };
    },
    MOCK_ORDERS: MOCK_ORDERS,
    MOCK_WALKINS: MOCK_WALKINS,
    MENU: MENU,
    SHEETS_WEBAPP_URL: SHEETS_WEBAPP_URL
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
  </script>
</body>
